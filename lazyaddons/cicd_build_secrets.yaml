name: cicd_build_secrets
description: >
  Build log secret scanner for CI/CD pipelines. Analyzes build console output,
  pipeline YAML definitions, and job artifacts for common credential patterns:
  passwords, API keys, tokens, cloud provider credentials (AWS/GCP/Azure),
  SSH keys, database connection strings, and package registry tokens.
  Supports Jenkins, GitLab CI, GitHub Actions, Bitbucket Pipelines, and
  Azure DevOps log formats.
  MITRE: T1552.005 Cloud Instance Metadata API, T1213 Data from Repositories.
author: LazyOwn Team
version: '0.1.0'
enabled: true
params:
  - name: file
    type: string
    required: true
    description: Path to build log file to scan for secrets
os: any
trigger: []
tool:
  name: CI/CD — Build Log Secrets Scanner
  install_path: modules/
  lazycommand: cicd_secrets
  env:
    FILE: "{file}"
category: "20. CI/CD Pipeline Attacks"
