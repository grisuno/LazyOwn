name: blacksandbeacon
description: 'BlackSandBeacon is a Linux-native, memory-resident C2 beacon with native
  in-memory ELF BOF loading: position-independent objects are fetched from the C2 and
  executed through W^X trampolines (RunELF) so nothing ever touches the target disk.
  Wire contract (v1.1 fileless): AES-256-CFB (CFB-128), HKDF-SHA256 derived keys
  (salt blacksandbeacon-v2, info enc/hmac) and replay-protected reports
  (counter + timestamp envelope) — the exact protocol lazyc2.py speaks.

  Repo layout: beacons/v1 (canonical pull mode), beacons/v2 (mesh/p2p),
  beacons/v3 (experimental), bof/<name>/ (whoami, is_sudo, cat, userenum,
  suid_enum), c2/server.py (reference Gopher-style C2 with diskless staging),
  config/config.json (all runtime knobs; crypto.master_key_hex preferred over
  the legacy aes_key_hex; optional TLS cert_fingerprint_sha256 pinning).

  Operator flow:
    1. Run `blacksandbeacon` — git restore + git pull + make beacon; stages the
       binary at sessions/temp_uploads/blacksandbeacon.
    2. Run `bsb_stage` — aligns the runtime config with the LazyOwn C2 (poll
       /command/<id>, master key from sessions/key.aes), stages the /s/
       implant files, generates a stage_token on first use and copies the
       fallback-chained one-liner to the clipboard:
       upstream /stage/ stager || raw /s/ memfd stager || disk curl.
    3. Paste the one-liner on the target: it fetches the ELF and config
       over HTTPS, memfd_create both and execve the beacon straight from
       anonymous memory (no disk writes, argv[0] kworker camo).
    4. Queue commands with issue_command_to_c2; run BOFs with bof_run.

  First-time setup: assign lhost, lport and c2_port in payload.json. Free args
  pass make targets: `blacksandbeacon beacon-v2` (mesh variant), `blacksandbeacon
  all-beacons`, `blacksandbeacon bofs`.

  '
author: LazyOwn RedTeam
version: '1.2'
enabled: true
update: true
params:
- name: lhost
  type: string
  required: true
  description: Attacker C2 IP or hostname the beacon will call back to.
- name: lport
  type: string
  required: true
  description: C2 listener port (HTTP staging endpoint).
- name: c2_port
  type: string
  required: true
  description: C2 HTTPS port (encrypted command channel).
os: linux
trigger: []
tool:
  name: blacksandbeacon
  repo_url: https://github.com/grisuno/blacksandbeacon.git
  install_path: external/.exploit/blacksandbeacon
  install_command: make
  execute_command: git restore . ; git pull ; make beacon && cp build/beacon ../../../sessions/temp_uploads/blacksandbeacon
    && cp build/config.json ../../../sessions/temp_uploads/blacksandbeacon_config &&
    echo "[blacksandbeacon] beacon + config staged at sessions/temp_uploads/"
  lazycommand: bsb_stage
category: 10. Command & Control
