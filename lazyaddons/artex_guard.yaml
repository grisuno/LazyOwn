name: artex_guard
description: Review ARTEX v0.3.12 operation approvals, agents and reports in English
  (human-in-loop guard). Needs artex up and assign url http://127.0.0.1:8787. Lists
  pending approvals. Allow or deny via POST /api/intercept/pending/{id}/decide free
  args. Agents at /api/agents, report at /api/report.
author: Hinln (fork of Autumn-27)
version: 0.3.12
enabled: true
update: true
params:
  - name: url
    type: string
    required: true
    description: ARTEX base URL, e.g. http://127.0.0.1:8787. Set with assign url.
os: any
trigger: []
category: 16. Artificial Intelligence
tool:
  name: ARTEX Guard
  repo_url: https://github.com/Hinln/ARTEX.git
  install_path: external/.exploit/artex
  install_command: git fetch --all --tags && git checkout 0ec51e3 && go build -tags
    embedui -o artex ./cmd/artex
  execute_command: curl -sSf {url}/api/intercept/pending
