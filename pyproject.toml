# pyproject.toml
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyown"
version = "0.2.157"
description = "LazyOwn Framework - Red Team & Post-Exploitation Tool"
authors = [{ name = "Gris Iscomeback", email = "grisiscomeback@gmail.com" }]
license = { text = "GPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "cmd2",
    "python-libnmap",
    "pwncat-cs",
    "pwn",
    "groq",
    "pypdf>=6.1.1",
    "python-docx",
    "olefile",
    "exifread",
    "pycryptodome",
    "impacket",
    "pandas",
    "colorama",
    "tabulate",
    "pyarrow",
    "keyboard",
    "flask-unsign",
    "name-that-hash",
    "certipy-ad",
    "pykeepass",
    "Pillow",
    "netaddr",
    "stix2",
    "pyautogui",
    "networkx",
    "pyvis",
    "markdown",
    "scapy",
    "watchdog",
    "flask-login",
    "flask-wtf",
    "bcrypt",
    "pyyaml",
    "bs4",
    "dnslib",
    "python-telegram-bot",
    "nest_asyncio",
    "rich",
    "flask_socketio",
    "autobloody",
    "minikerberos",
    "tinydb",
    "msldap",
    "prettytable",
    "fire",
    "wget",
    "pypykatz",
    "donut",
    "uro",
    "lupa",
    "flask_sock",
    "donut-shellcode",
    "flask_limiter",
    "aiosmtpd",
    "yagmail",
    "validators",
    "ua_parser",
    "pdf2image",
    "python-magic",
    "packaging",
    "mcp>=1.0.0"
]


[project.scripts]
lazyown = "lazyown:main"

[project.urls]
Homepage = "https://github.com/grisuno/LazyOwn"
Repository = "https://github.com/grisuno/LazyOwn"
Documentation = "https://grisuno.github.io/LazyOwn/"

[project.optional-dependencies]
ml = [
    "torch",
    "torchvision",
    "torchaudio",
    "scikit-learn",
    "seaborn",
    "joblib",
]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
    "bandit>=1.7",
    "detect-secrets>=1.5",
    "pip-audit>=2.7",
    "pre-commit>=3.5",
    "coverage>=7.15.4",
    "nodeenv>=1.10",
]

[tool.setuptools.packages.find]
include = ["lazyown*", "lazyc2*", "utils", "cli*", "core*", "modules*", "skills*", "plugins*", "lazyaddons*", "lazyscripts*", "profiles*"]
exclude = ["tests*", "env*", "build*", "external*", "modules_ext*", "parquets*", "sessions*", "graphify-out*", "deploy*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "env",
    "build",
    "external",
    "modules_ext",
    "graphify-out",
    "sessions",
    "parquets",
    "cli/commands/*_migrated.py",
    "lazyown.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",
    # Security rules we accept for a pentest framework (many intentional)
    "S101", "S105", "S106", "S107", "S108",
    "S110", "S112", "S113",
    "S301", "S310", "S311", "S324",
    "S404", "S602", "S603", "S605", "S607",
    "B008", "B904",
    # Wildcard import — in lazyown.py, still 100+ symbols needed; gradual cleanup in progress
    "F405",
    # Unused variable — too aggressive with auto-fix, can break side-effect assignments
    "F841",
    # Gradual typing — will fix file by file
    "UP007", "UP008", "UP015", "UP032",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# cli/commands: S103/S104/S608 are intentional in a pentest framework
# (payloads chmod 0o755, C2 binding 0.0.0.0, imports over hardcoded tables).
"cli/commands/*" = ["S103", "S104", "S608"]
# Legacy monoliths — gradual cleanup in progress
# Tier 1: core/ and cli/ have full linting enabled
# Tier 2: modules/, skills/, plugins/ get security-only ignores
"modules/*" = ["S"]
"skills/*" = ["S"]
"plugins/*" = ["S"]
# Tier 3: god classes still need broad ignores during refactor
"lazyown.py" = ["S", "B", "UP", "F841"]
"lazyc2.py" = ["S", "B", "UP", "F841"]
"utils.py" = ["S", "B", "UP", "F841"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: integration tests touching real services or sessions/ fixtures",
    "slow: tests that take more than a few seconds",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
follow_imports = "silent"
exclude = [
    "env/",
    "build/",
    "external/",
    "modules_ext/",
    "graphify-out/",
    "sessions/",
    "parquets/",
    "lazyown.py",
    "lazyc2.py",
    "utils.py",
]

[tool.bandit]
exclude_dirs = [
    "env",
    "build",
    "external",
    "modules_ext",
    "graphify-out",
    "sessions",
    "tests",
]
skips = [
    "B101",
    "B404",
    "B602",
    "B603",
    "B605",
    "B607",
]