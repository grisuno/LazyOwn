name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Collect tests
        run: pytest --collect-only -q
      - name: Run tests
        run: pytest -q --tb=short -x -k "not slow and not integration" --cov=lazyown --cov=cli --cov=core --cov=lazyc2 --cov=modules --cov=skills --cov-report=term --cov-fail-under=1
