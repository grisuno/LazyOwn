<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; background: #111; color: #ddd; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #7ef29d; }
    label { display: block; font-size: 11px; margin: 8px 0 3px; color: #999; }
    input { width: 100%; box-sizing: border-box; padding: 5px; font-size: 12px; background: #1c1c1c; color: #ddd; border: 1px solid #333; border-radius: 4px; }
    button { margin-top: 10px; width: 100%; padding: 7px; font-size: 12px; background: #2f6d43; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    button:hover { background: #3b8a55; }
    #status { margin-top: 10px; font-size: 11px; min-height: 28px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>LazyOwn Browser Sync</h1>
  <label for="endpoint">Endpoint</label>
  <input id="endpoint" placeholder="http://127.0.0.1:8898/__lazyown/sync" />
  <label for="token">Token (browsersync token)</label>
  <input id="token" placeholder="paste the LazyOwn receiver token" />
  <label for="interval">Auto-sync interval (minutes)</label>
  <input id="interval" type="number" min="1" max="1440" />
  <label for="domainFilter">Domain filter (opt-in, comma separated; empty = all)</label>
  <input id="domainFilter" placeholder="example.com, target.org" />
  <button id="save">Save</button>
  <button id="sync">Sync now</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
