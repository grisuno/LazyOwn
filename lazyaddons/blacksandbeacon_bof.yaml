name: blacksandbeacon_bof
description: 'Linux BOF (Beacon Object File) loader for BlackSandBeacon. Compiles the
  position-independent ELF objects and stages them where the C2 serves them, so a
  live beacon can fetch and execute them in memory.

  Linux BOFs are plain ELF objects loaded by the beacon through the in-memory
  RunELF loader with W^X trampolines and forced stack alignment — no dlopen, no
  temp files, no loader binary on the target. Arguments travel through a datap
  API mirroring the Windows BOF contract (BeaconDataParse, BeaconDataInt,
  BeaconDataExtract) so existing BOF source ports with minimal changes.

  Compiled objects are served by the C2 at /download/bofs/<name> and delivered
  with a `bof:<url>[ args]` command queued on the session (the beacon downloads
  the object and calls go(args, alen)).

  Write a new BOF:
    - Export void go(char *args, int alen); include bof/include/beacon_api.h.
    - Compile with: make bof-<name> (gcc -fPIC -nostdlib -m64).

  Usage:
    blacksandbeacon_bof            — git pull + make bofs, stage build/bof/*.x64.o
                                     to sessions/temp_uploads/bofs/
    bof_catalog                    — list the staged BOF delivery catalog
    bof_run whoami <beacon_id>     — queue a bof: command on a live session

  '
author: LazyOwn RedTeam
version: '1.1'
enabled: true
update: true
params:
- name: lhost
  type: string
  required: true
  description: Attacker C2 IP or hostname.
- name: lport
  type: string
  required: true
  description: C2 staging port where the compiled BOFs are served.
os: linux
trigger: []
tool:
  name: blacksandbeacon_bof
  repo_url: https://github.com/grisuno/blacksandbeacon.git
  install_path: external/.exploit/blacksandbeacon
  install_command: make
  execute_command: git restore . ; git pull ; make bofs && mkdir -p ../../../sessions/temp_uploads/bofs
    && cp build/bof/*.x64.o ../../../sessions/temp_uploads/bofs/ && echo "[blacksandbeacon_bof]
    BOFs staged at sessions/temp_uploads/bofs/"
  lazycommand: bof_catalog
category: 10. Command & Control
