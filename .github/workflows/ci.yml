name: CI

on:
  push:
    branches: [main, dev, pp]
  pull_request:
    branches: [main, dev, pp]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nmap libpcap-dev 2>/dev/null || true
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -x --tb=short --timeout=300 -p no:cacheprovider
        env:
          LAZYOWN_TEST_MODE: "1"

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install bandit pip-audit
      - name: Bandit security scan
        run: bandit -c pyproject.toml -r . -f json -o bandit-report.json || true
      - name: pip-audit dependency scan
        run: pip-audit || true

  mypy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project + types
        run: |
          pip install -e ".[dev]"
          pip install types-requests types-PyYAML types-tabulate 2>/dev/null || true
      - name: mypy type check
        continue-on-error: true
        run: mypy --config-file pyproject.toml --no-strict-optional --explicit-package-bases core cli setup.py
