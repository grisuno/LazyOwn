name: harvester_live_domain
description: Harvest AWS AKIA/ASIA keys from JS files of a live domain
category: recon
enabled: true
tags:
- keys
- aws
- js
- recon
- osint
tool:
  execute_command: curl -sL "{target}" | grep -oP 'https?://[^"\x27]+\.js' | xargs -I{} curl -sL {} 2>/dev/null | grep -oP '\bA[KS]IA[0-9A-Z]{16}\b' | sort -u
params:
  target:
    type: str
    required: true
    description: Target URL (e.g. https://example.com)
