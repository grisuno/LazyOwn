name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format check
        run: ruff format --check .
      - name: check command_index.json
        run: python scripts/build_command_index.py --check
      - name: mypy (core + cli)
        run: mypy --config-file pyproject.toml core cli setup.py

  test:
    name: pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: pytest
        run: pytest -q --tb=short -x -k "not slow and not integration" --cov=lazyown --cov=cli --cov=core --cov=lazyc2 --cov=modules --cov=skills --cov-report=term --cov-fail-under=1

  security:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bandit
        run: pip install bandit
      - name: bandit scan
        run: bandit -q -r . -x env,build,external,modules_ext,graphify-out,sessions,parquets,tests
