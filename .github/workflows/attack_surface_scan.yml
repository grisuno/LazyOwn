name: Attack Surface Scan

on:
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: Target IP or domain to scan
        required: false
        default: ""
      cloud_provider:
        description: Cloud provider (aws, azure, gcp)
        required: false
        default: aws
      scan_type:
        description: Scan type (full, cloud-only, supply-chain-only)
        required: false
        default: full

jobs:
  attack_surface_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout LazyOwn
        uses: actions/checkout@v4
        with:
          repository: grisuno/LazyOwn
          path: LazyOwn

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: LazyOwn/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nmap whatweb nikto jq

      - name: Install LazyOwn
        run: |
          cd LazyOwn
          python -m venv env
          source env/bin/activate
          pip install -r requirements.txt
          # Pre-install addon dependencies (Go for Trivy/Grype)
          which go || sudo apt-get install -y -qq golang-go

      - name: Configure cloud credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          # Set provider-specific env vars if secrets are available
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "AWS credentials configured"
          fi
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "Azure credentials configured"
          fi
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "$GOOGLE_APPLICATION_CREDENTIALS" > /tmp/gcp-creds.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json
          fi

      - name: Build headless profile
        run: |
          cd LazyOwn
          TARGET="${{ github.event.inputs.target || '' }}"
          PROVIDER="${{ github.event.inputs.cloud_provider || 'aws' }}"
          cat > profiles/ci_scan.yaml <<PROFILE
          rhost: "${TARGET}"
          lhost: "127.0.0.1"
          cloud_provider: "${PROVIDER}"
          cloud_region: "us-east-1"
          trivy_target: "."
          trivy_scan_type: "fs"
          grype_target: "."
          scope_enforcement: "report"
          auto_approve: true
          c2_enabled: false
          PROFILE
          echo "Profile created:"
          cat profiles/ci_scan.yaml

      - name: Run attack surface scan (headless)
        id: scan
        run: |
          cd LazyOwn
          source env/bin/activate
          SCAN_TYPE="${{ github.event.inputs.scan_type || 'full' }}"
          case "$SCAN_TYPE" in
            cloud-only)
              CHAIN="pipeline run cloud_assessment"
              ;;
            supply-chain-only)
              CHAIN="pipeline run supply_chain"
              ;;
            *)
              CHAIN="pipeline run attack_surface"
              ;;
          esac
          echo "Running: $CHAIN"
          python -W ignore lazyown.py \
            --headless \
            --json-output \
            --profile profiles/ci_scan.yaml \
            --run-chain "$CHAIN" 2>&1 | tee /tmp/scan_output.jsonl

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attack-surface-results
          path: |
            LazyOwn/sessions/
            !LazyOwn/sessions/**/__pycache__/
          retention-days: 30
          compression-level: 6

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engagement-report
          path: |
            LazyOwn/sessions/reports/*.md
            LazyOwn/sessions/reports/*.docx
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## Attack Surface Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Target | ${{ github.event.inputs.target || '(default)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud Provider | ${{ github.event.inputs.cloud_provider || 'aws' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | ${{ github.event.inputs.scan_type || 'full' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Exit Code | ${{ steps.scan.outcome }} |" >> $GITHUB_STEP_SUMMARY
