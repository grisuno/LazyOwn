name: ghidramcp
description: |
  GhidraMCP bridge - MCP server exposing Ghidra decompile/rename/xrefs to LLMs.
  First time: install Ghidra, add release zip via File Install Extensions, enable
  GhidraMCPPlugin, then sys pip install -r requirements.txt happens on clone.
  Flow: open binary in Ghidra, start MCP HTTP server, then assign ghidra_server
  http://127.0.0.1:8080/ and run ghidramcp. Append --transport sse as free args.
author: LaurieWired
version: "1.2"
enabled: true
params:
  - name: ghidra_server
    type: string
    required: false
    default: http://127.0.0.1:8080/
    description: Ghidra MCP HTTP server URL. Set with assign ghidra_server URL.
os: any
trigger: []
category: "03. Exploitation"
tool:
  name: GhidraMCP
  repo_url: https://github.com/LaurieWired/GhidraMCP.git
  install_path: external/.exploit/GhidraMCP
  install_command: pip install --break-system-packages -r requirements.txt || pip install -r requirements.txt
  execute_command: python3 bridge_mcp_ghidra.py --ghidra-server {ghidra_server} --transport stdio
