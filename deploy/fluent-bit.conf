[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info

[INPUT]
    Name          tail
    Path          /var/log/lazyown/*.jsonl,/var/log/lazyown/**/*.jsonl
    Parser        json
    Tag           lazyown.*
    Refresh_Interval 10

[INPUT]
    Name          tail
    Path          /var/log/lazyown/engagement_audit.jsonl
    Parser        json
    Tag           lazyown.audit
    Refresh_Interval 5

[INPUT]
    Name          tail
    Path          /var/log/lazyown/api_command_audit.jsonl
    Parser        json
    Tag           lazyown.api
    Refresh_Interval 5

[FILTER]
    Name          modify
    Match         lazyown.*
    Add           source LazyOwn
    Add           sourcetype lazyown_redteam

[OUTPUT]
    Name          stdout
    Match         lazyown.*
    Format        json_lines

[OUTPUT]
    Name          es
    Match         lazyown.*
    Host          elasticsearch
    Port          9200
    Index         lazyown
    Type          _doc
    Logstash_Format Off
    Retry_Limit   3
