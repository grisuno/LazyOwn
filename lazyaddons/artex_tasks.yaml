name: artex_tasks
description: List ARTEX v0.3.12 pentest tasks via API in English. Needs server up
  (run artex) and assign url http://127.0.0.1:8787 once. Runs curl on /api/tasks.
  Create via free args, e.g. POST JSON to the same base. Control batches via POST
  /api/tasks/control/batch. Save output with free arg -o sessions/artex_tasks.json.
author: Hinln (fork of Autumn-27)
version: 0.3.12
enabled: true
params:
  - name: url
    type: string
    required: true
    description: ARTEX base URL, e.g. http://127.0.0.1:8787. Set with assign url.
os: any
trigger: []
category: 16. Artificial Intelligence
tool:
  name: ARTEX Tasks
  repo_url: https://github.com/Hinln/ARTEX.git
  install_path: external/.exploit/artex
  install_command: git fetch --all --tags && git checkout 0ec51e3 && go build -tags
    embedui -o artex ./cmd/artex
  execute_command: curl -sSf {url}/api/tasks
