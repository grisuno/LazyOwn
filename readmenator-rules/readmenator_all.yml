# ReadMenator suggested rules (combined)
# Generated by readmenator rule generator

rules:
  - id: rm-hardcoded-password
    pattern-either:
      - pattern: "password = "...""
      - pattern: "passwd = "...""
      - pattern: "pwd = "...""
    message: "Do not hardcode credentials"
    severity: ERROR
    languages: [python, javascript, typescript, java, go]


rules:
  - id: rm-print-statement
    pattern: "print(...)"
    message: "Use logging module instead of print()"
    severity: INFO
    languages: [python]

