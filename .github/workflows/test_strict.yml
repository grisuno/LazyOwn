name: tests_strict

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nmap libpcap-dev
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
          pip install types-requests types-PyYAML types-tabulate types-Markdown
      - name: Collect tests
        run: pytest --collect-only -q
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy --config-file pyproject.toml --no-strict-optional --explicit-package-bases core cli setup.py
      - name: Run bandit
        run: bandit -c pyproject.toml -r . --severity-level high
      - name: Run pytest
        run: pytest -q --timeout=300 -p no:cacheprovider
