name: tests_strict

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Collect tests
        run: pytest --collect-only -q
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy --ignore-missing-imports lazyown.py utils.py
      - name: Run bandit
        run: bandit -q -r lazyown.py utils.py
      - name: Run pytest
        run: pytest -q
