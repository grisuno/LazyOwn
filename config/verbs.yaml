      re-exploiting the issue, they missed a spot where ShieldBreak can still be exploited.
    source: addon
  addon:SigPloit:
    enabled: false
    phase: exploit
    risk: safe
    description: SigPloit a signaling security testing framework dedicated to Telecom
      Security professionals and reasearchers to pentest and exploit vulnerabilites
      in the signaling protocols used in mobile operators regardless of the geneartion
      being in use. SigPloit aims to cover all used protocols used in the operators
      interconnects SS7, GTP (3G), Diameter (4G) or even SIP for IMS and VoLTE infrastructures
      used in the access layer and SS7 message encapsulation into SIP-T. Recommendations
      for each vulnerability will be provided to guide the tester and the operator
      the steps that should be done to enhance their security posture
    source: addon
  addon:Zapscape:
    enabled: false
    phase: exploit
    risk: safe
    description: Zapscape is a use-after-free vulnerability in the shadow MMU emulation
      of KVM/x86, specifically in the recursive zap path that runs when shadow pages
      are reclaimed. It can trigger the bug with guest-side actions alone to corrupt
      the host kernel shadow page, and it can threaten the guest-host isolation of
      KVM/x86 hosts that accept untrusted guests and expose nested virtualization,
      particularly multi-tenant x86 public clouds.
    source: addon
  addon:adcs_attacks:
