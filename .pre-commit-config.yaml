repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: '^(graphify-out/|sessions/|parquets/|external/|modules_ext/|modules/|templates/|static/|docs/|banners/|assets/|plugins/|lazyaddons/|lazyadversaries/|lazyscripts/|poc_tui/|yara_rules/|tools/|\.hermes/|\.readmenator_cache/|readmenator-graphrag/|readmenator-agent/|readmenator-wiki/|readmenator-maps/|my_techniques\.json$|.*\.(svg|min\.js|min\.css|mp4|png|gif|jpe?g|ico|ttf|woff2?|pdf)$)'
      - id: trailing-whitespace
        exclude: '^(graphify-out/|sessions/|parquets/|external/|modules_ext/|modules/|templates/|static/|docs/|banners/|assets/|plugins/|lazyaddons/|lazyadversaries/|lazyscripts/|poc_tui/|yara_rules/|tools/|\.hermes/|\.readmenator_cache/|readmenator-graphrag/|readmenator-agent/|readmenator-wiki/|readmenator-maps/|my_techniques\.json$|.*\.(svg|min\.js|min\.css|mp4|png|gif|jpe?g|ico|ttf|woff2?|pdf)$)'
      - id: check-yaml
        exclude: '^(graphify-out/|sessions/|external/|modules_ext/|deploy/|.github/ISSUE_TEMPLATE/|readmenator-rules/|templates/)'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: '^(graphify-out/|sessions/|parquets/|external/|modules_ext/)'
      - id: detect-private-key
        exclude: '^(graphify-out/|sessions/|external/|tests/|modules_ext/|readmenator-graphrag/|readmenator-agent/|cert\.pem$|key\.pem$|utils\.py$)'

  - repo: local
    hooks:
      - id: check-command-index
        name: check command_index.json
        entry: python3 scripts/build_command_index.py --check
        language: system
        files: '^(lazyown\.py|cli/commands/.*\.py|cli/commands/.*\.yaml)$'
        types_or: [python, yaml]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
        types_or: [python]
        exclude: '^(graphify-out/|sessions/|parquets/|external/|modules_ext/)'
      - id: ruff-format
        types_or: [python]
        exclude: '^(graphify-out/|sessions/|parquets/|external/|modules_ext/)'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: ['--config-file', 'pyproject.toml', '--no-strict-optional', '--explicit-package-bases', 'core', 'cli']
        additional_dependencies: ['types-requests', 'types-PyYAML', 'types-Markdown']
        exclude: '^(graphify-out/|sessions/|parquets/|external/|modules_ext/|env/|lazyown\.py$|lazyc2\.py$|utils\.py$)'
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^(graphify-out/|sessions/|parquets/|external/|modules_ext/|readmenator-graphrag/|readmenator-agent/|payload\.json$|tests/test_credential_vault\.py$|.*\.lock$|.*\.min\.(js|css)$)'
