name: php2shell
description: |
  PHP 8.4.26 / mod_php exploit framework targeting session upload progress heap leaks and fake zend_string chain to get code execution.
author: murrez
version: "1.0"
enabled: true
os: linux
trigger: [http, https]
category: "03. Exploitation"
module_type: exploit
params:
  - name: url
    type: string
    required: true
    description: Target URL (e.g. http://target/index.php)
  - name: cmd
    type: string
    required: false
    description: Command to execute (default id>/out/p1)
  - name: profile
    type: string
    required: false
    description: Profile lab/bookworm/auto (default auto)
tool:
  name: php2shell
  repo_url: https://github.com/murrez/php2shell.git
  install_path: external/.exploit/php2shell
  install_command: pip install -r requirements.txt 2>&1 | tail -2
  execute_command: python exploit.py -u {url} -c "{cmd}"
