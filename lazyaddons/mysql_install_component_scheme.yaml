name: mysql_install_component_scheme
description: |
  MySQL 26.7.0 INSTALL COMPONENT qualified-scheme RCE lab (Abraxas Labs, CVSS 7.2 High, CWE-427).
  Spins a loopback docker lab (mysql:26.7.0 on 127.0.0.1:18650) and proves the
  file.mysql_minimal_chassis URN loads a stock component from outside plugin_dir.
  First time: needs docker plus python3 with pymysql and cryptography installed.
  Flow: assign rhost 127.0.0.1, assign rport 18650, then run mysql_install_component_scheme.
  Lab-only, authorized testing. No custom implant, stock .so witness.
author: abraxas
version: "1.0"
enabled: true
params:
  - name: rhost
    type: string
    required: false
    default: 127.0.0.1
    description: Lab MySQL host. The lab is loopback-pinned by upstream run.sh.
  - name: rport
    type: integer
    required: false
    default: 18650
    description: Lab MySQL port for the install-component-scheme compose stack.
os: any
trigger: []
category: "03. Exploitation"
module_type: exploit
tool:
  name: mysql-install-component-scheme
  repo_url: https://github.com/abraxas/mysql-install-component-scheme.git
  install_path: external/.exploit/mysql-install-component-scheme
  install_command: python3 -m pip install --break-system-packages pymysql cryptography
  execute_command: python3 mysql-install-component-scheme-Abraxas-Labs.py
