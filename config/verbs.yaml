  addon:ATTPwn:
    enabled: false
    phase: lateral
    risk: exploit
    description: ATTPwn is a computer security tool designed to emulate adversaries.
      The tool aims to bring emulation of a real threat into closer contact with implementations
      based on the techniques and tactics from the MITRE ATT&CK framework. The goal
      is to simulate how a threat works in an intrusion scenario, where the threat
      has been successfully deployed. It is focused on Microsoft Windows systems through
      the use of the Powershell command line. This enables the different techniques
      based on MITRE ATT&CK to be applied. ATTPwn is designed to allow the emulation
      of adversaries as for a Red Team exercise and to verify the effectiveness and
      efficiency of the organization's controls in the face of a real threat.
    source: addon
  addon:AdaptixC2:
    enabled: false
    phase: exploit
    risk: safe
    description: Adaptix is an extensible post-exploitation and adversarial emulation
      framework made for penetration testers. The Adaptix server is written in Golang
      and to allow operator flexibility. The GUI Client is written in C++ QT, allowing
      it to be used on Linux, Windows, and MacOS operating systems.
    source: addon
  addon:AuroraPatch:
    enabled: false
    phase: enum
    risk: safe
    description: AuroraPatch is a lightweight, offensive Go tool that bypasses Windows
      AMSI (Anti-Malware Scan Interface) by patching the AmsiScanBuffer function in
      memory. Designed for red teamers and security researchers by LazyOwn RedTeam,
      it allows execution of scripts that would otherwise be blocked by Defender or
      other AMSI-integrated AVs.
    source: addon
  addon:BlackObsidianC2:
    enabled: false
    phase: exploit
    risk: safe
    description: 'Black Obsidian is a next-generation C2 (Command & Control) server
      designed for professional Red Team operations. Built with Go and PocketBase,
      it offers a modern and specialized alternative to complex C2 servers while maintaining
      agility, security, and customization ease. USAGE: ./c2-server serve --https=0.0.0.0:4444'
    source: addon
  addon:CVE-2022-22077:
    enabled: false
    phase: exploit
    risk: safe
    description: CVE-2022-22077 is a high-severity vulnerability (CVSS score 7.8)
      affecting the RTCore64.sys driver distributed with MSI Center and Dragon Center
      applications. The vulnerability stems from exposed IOCTL interfaces that allow
      unprivileged users to perform arbitrary physical memory reads and writes, effectively
      bypassing all Windows kernel security mechanisms.
    source: addon
  addon:CVE-2026-25089:
    enabled: false
    phase: exploit
    risk: safe
    description: 'CVE-2026-25089 is a critical OS Command Injection (CWE-78) vulnerability
      affecting multiple Fortinet FortiSandbox deployments. An unauthenticated remote
      attacker can exploit this flaw by sending specially crafted HTTP requests, resulting
      in arbitrary command execution on the underlying operating system. Usage: CVE-2026-25089
      whoami'
    source: addon
  addon:CVE_2025_24071_PoC:
    enabled: false
    phase: exploit
    risk: safe
    description: "CVE-2025-24071: NTLM Hash Leak via RAR/ZIP Extraction and .library-ms\
      \ File. Windows Explorer automatically initiates an SMB authentication request\
      \ when a .library-ms file is extracted from a .rar archive, leading to NTLM\
      \ hash disclosure. The user does not need to open or execute the file\u2014\
      simply extracting it is enough to trigger the leak. https://cti.monster/blog/2025/03/18/CVE-2025-24071.html"
    source: addon
  addon:Clematis:
    enabled: false
    phase: exploit
    risk: safe
    description: "\U0001F6E0\uFE0F A powerful tool for converting PE files (EXE/DLL)\
      \ into position-independent shellcode."
    source: addon
  addon:CompressLoader:
    enabled: false
    phase: exploit
    risk: safe
    description: CompressLoader is a specialized Windows PE payload delivery framework
      designed to bypass security controls by minimizing the on-disk footprint and
      obfuscating execution patterns. It transforms a standard Windows executable
      into a compressed, encrypted binary artifact that is retrieved over the network
      and reflectively loaded into memory without ever touching the targets physical
      disk
    source: addon
  addon:FreeDom:
    enabled: false
    phase: exploit
    risk: safe
    description: From the creators of LazyOwn Redteam Framework comes a free and open-source
      minimal web browser written in C, focused on Zero Trust and Zero Knowledge principles.
    source: addon
  addon:Get_ReverseShell:
    enabled: false
    phase: exploit
    risk: safe
    description: Get-ReverseShell is a project that stems from the Invoke-PSObfuscation
      framework, with the sole purpose of producing obfuscated reverse shells for
      PowerShell.
    source: addon
  addon:GoPEInjection:
    enabled: false
    phase: exploit
    risk: exploit
    description: Golang PE injection on windows
    source: addon
  addon:Januscape:
    enabled: false
    phase: exploit
    risk: safe
    description: Januscape is a use-after-free vulnerability in the shadow MMU emulation
      of KVM/x86. It can trigger the bug with guest-side actions alone to corrupt
      the host kernel's shadow page, and it can threaten the guest-host isolation
      of KVM/x86 hosts that accept untrusted guests and expose nested virtualization,
      particularly multi-tenant x86 public clouds (GCP, AWS, etc.).
    source: addon
  addon:LazyLoader:
    enabled: false
    phase: exploit
    risk: safe
    description: LazyLoader is A stealthy LazyLoader Windows PE loader designed to
      fetch, decrypt, and execute payloads remotely while evading detection. usage
      like this .\loader 10.10.14.91 80 cipher.bin key.bin
    source: addon
  addon:LazyOwnExplorer:
    enabled: false
    phase: exploit
    risk: safe
    description: Ejecuta el script LazyOwnExplorer.py que se encuentra en la carpeta
      modules.
    source: addon
  addon:LazyOwnOpenCodeAdapter:
    enabled: false
    phase: exploit
    risk: safe
    description: "From the creators of LazyOwn Redteam Framework comes a free and\
      \ open-source minimal production\u2011grade, low\u2011level LazyOwnOpenCodeAdapter\
      \ for Linux systems that captures keystrokes directly from the kernel\u2019\
      s input subsystem (evdev). It operates as a daemon, logs every key press with\
      \ microsecond precision, and supports keyboard modifiers (Shift, Ctrl, Alt,\
      \ CapsLock). Designed for authorized security audits, penetration testing, system\
      \ monitoring, and debugging input pipelines. This implementation is written\
      \ in standard C, uses no external libraries beyond the GNU C library, and runs\
      \ on any Linux kernel \u2265 2.6."
    source: addon
  addon:LazyOwnTUI:
    enabled: false
    phase: exploit
    risk: safe
    description: "Launch the native Textual TUI shell \u2014 a full-screen interactive\
      \ interface with live dashboard sidebar, accumulated output log, command browser,\
