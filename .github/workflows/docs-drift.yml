name: docs-drift
on:
  pull_request:
    paths: ["cli/commands/**.py", "lazyaddons/**", "tools/**", "COMMANDS.md", "README.md", "skills/lazyown.md"]
  push:
    branches: [dev]
    paths: ["cli/commands/**.py", "lazyaddons/**", "tools/**", "COMMANDS.md", "README.md", "skills/lazyown.md"]
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Rebuild command index
        run: python3 scripts/build_command_index.py
      - name: Fail on drift
        run: git diff --exit-code -- COMMANDS.md || (echo "COMMANDS.md drifted. Run python3 scripts/build_command_index.py" && exit 1)
      - name: Check onboarding smoke
        run: bash scripts/smoke_onboarding.sh
