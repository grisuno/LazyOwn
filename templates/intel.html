{% extends "base.html" %}
{% block content %}
<style>
#rm-root{--canvas:#020617;--stage:#030a1c;--mask:#0b1224;--mask2:#111c33;--ink:#f8fafc;--muted:#94a3b8;--faint:#475569;--border:#1e293b;--accent:#22d3ee;--accent2:#f472b6;--warn:#fb7185;--ok:#34d399;--caution:#fbbf24;--glow:rgba(34,211,238,.16);--label-bg:rgba(2,6,23,.80);--label-ink:#e2e8f0;--rim:#020617;--dim3d:#1a2236}
#rm-root[data-theme="light"]{--canvas:#f8fafc;--stage:#eef2f7;--mask:#ffffff;--mask2:#f1f5f9;--ink:#0f172a;--muted:#475569;--faint:#94a3b8;--border:#e2e8f0;--accent:#0891b2;--accent2:#db2777;--warn:#e11d48;--ok:#059669;--caution:#b45309;--glow:rgba(8,145,178,.10);--label-bg:rgba(255,255,255,.90);--label-ink:#0f172a;--rim:#ffffff;--dim3d:#d5dbe5}
#rm-root *{box-sizing:border-box}
#rm-root{margin:0;background:var(--canvas);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;display:flex;flex-direction:column}
#rm-root a{color:var(--accent)}
#rm-root button{font:inherit;font-size:12px;background:var(--mask);border:1px solid var(--border);border-radius:9px;padding:6px 10px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
#rm-root button:hover,#rm-root button:focus-visible{border-color:var(--accent);outline:none}
#rm-root button:disabled{opacity:.45;cursor:default}
#rm-root button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,var(--mask));border-color:var(--accent)}
#rm-root kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:10.5px;color:var(--muted)}
#rm-root [hidden]{display:none!important}
#rm-root .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--mask) 92%,transparent);backdrop-filter:blur(8px);position:relative;z-index:10}
#rm-root .brand{display:flex;flex-direction:column;min-width:0;margin-right:6px}
#rm-root .brand b{font-size:14px;background:linear-gradient(90deg,var(--ink),var(--accent) 70%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch}
#rm-root .brand span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#rm-root .home{font-size:12px;text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:6px 10px;color:var(--ink)}
#rm-root .home:hover{border-color:var(--accent)}
#rm-root .searchbox{position:relative;flex:1;min-width:220px;max-width:520px}
#rm-root .searchbox input{width:100%;background:var(--canvas);border:1px solid var(--border);border-radius:10px;color:var(--ink);padding:8px 10px 8px 30px;font:inherit;font-size:12px}
#rm-root .searchbox input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--glow)}
#rm-root .searchbox::before{content:"";position:absolute;left:11px;top:50%;width:9px;height:9px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-60%)}
#rm-root .results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--mask);border:1px solid var(--border);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.35);overflow:hidden;display:none;z-index:20}
#rm-root .results.open{display:block}
#rm-root .result{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border)}
#rm-root .result:last-child{border-bottom:none}
#rm-root .result[aria-selected="true"],#rm-root .result:hover{background:var(--mask2)}
#rm-root .result .dot{flex:none;width:9px;height:9px;border-radius:3px}
#rm-root .result .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rm-root .result .sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;max-width:55%}
#rm-root .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex:none}
#rm-root .seg button{border:none;border-radius:0;border-right:1px solid var(--border)}
#rm-root .seg button:last-child{border-right:none}
#rm-root .group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#rm-root .app{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
#rm-root #stage{position:relative;background:radial-gradient(1000px 520px at 20% 0%,var(--glow),transparent 70%),var(--stage);overflow:hidden;min-height:420px;touch-action:none}
#rm-root #stage.is3d{background:radial-gradient(900px 600px at 50% 40%,var(--glow),transparent 72%),radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--stage) 70%,var(--mask2)),var(--stage) 75%)}
#rm-root #graph{position:absolute;inset:0}
#rm-root #overlay{position:absolute;inset:0;pointer-events:none;z-index:2}
#rm-root .overlay{position:absolute;z-index:3;background:color-mix(in srgb,var(--mask) 88%,transparent);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(6px)}
#rm-root #hud{left:12px;top:12px;padding:6px 10px;font-size:11px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px)}
#rm-root #hud b{color:var(--ink)}
#rm-root #hud button{padding:1px 8px;font-size:10.5px}
#rm-root #legend{left:12px;bottom:12px;width:290px;max-height:min(62%,560px);overflow:auto;padding:8px 10px;font-size:11.5px}
#rm-root #legend.collapsed{width:auto}
#rm-root #legend.collapsed .lg-body{display:none}
#rm-root .lg-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#rm-root .lg-top button{padding:1px 8px;font-size:10.5px}
#rm-root #legend h3{margin:10px 0 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;font-weight:600}
#rm-root .lg-top h3{margin:0!important}
#rm-root .pills{display:flex;gap:5px;flex-wrap:wrap}
#rm-root .pill{font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 8px;cursor:pointer;user-select:none;background:transparent;display:inline-flex;align-items:center;gap:5px}
#rm-root .pill.active,#rm-root .pill[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
#rm-root .pill i{display:inline-block;width:12px;height:3px;border-radius:2px}
#rm-root .pill em{font-style:normal;color:var(--muted)}
#rm-root .seg.small button{font-size:10.5px;padding:2px 8px}
#rm-root .fam{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:7px}
#rm-root .fam:hover,#rm-root .fam[aria-pressed="true"]{border-color:var(--border);background:var(--mask2)}
#rm-root .fam i{flex:none;width:10px;height:10px;border-radius:3px;box-shadow:0 0 8px currentColor}
#rm-root .fam span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rm-root .fam em{margin-left:auto;font-style:normal;color:var(--muted)}
#rm-root #toast{right:12px;top:12px;max-width:min(420px,80%);padding:8px 12px;font-size:12px;border-color:var(--accent);display:none}
#rm-root #pickbar{left:50%;top:12px;transform:translateX(-50%);padding:7px 12px;font-size:12px;border-color:var(--accent2);display:flex;gap:10px;align-items:center}
#rm-root #pickbar button{padding:2px 8px;font-size:11px}
#rm-root #engine-error{display:none;margin:12px;background:var(--mask);border:1px solid var(--accent2);border-radius:10px;padding:10px 12px;font-size:12px}
#rm-root #tip{position:fixed;z-index:30;pointer-events:none;display:none;max-width:340px;background:var(--mask);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.55;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#rm-root #tip b{font-size:12.5px}
#rm-root #tip .m{color:var(--muted)}
#rm-root #tip .rel{color:var(--accent)}
#rm-root #tip .w{color:var(--caution)}
#rm-root #ctx{position:absolute;z-index:25;display:none;min-width:220px;background:var(--mask);border:1px solid var(--border);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.4);padding:5px}
#rm-root #ctx .ctx-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:5px 8px 6px;border-bottom:1px solid var(--border);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
#rm-root #ctx button{display:flex;justify-content:space-between;gap:14px;width:100%;text-align:left;border:none;background:transparent;padding:5px 8px;border-radius:6px}
#rm-root #ctx button:hover,#rm-root #ctx button:focus-visible{background:var(--mask2)}
#rm-root #ctx button kbd{margin-left:auto}
#rm-root #inspector{border-left:1px solid var(--border);background:var(--mask);overflow:auto;min-height:0;display:flex;flex-direction:column}
#rm-root .insp-empty{padding:22px 18px 8px;color:var(--muted);font-size:12px;line-height:1.8}
#rm-root .insp-empty h2{color:var(--ink);font-size:14px;margin:0 0 8px}
#rm-root .insp-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--mask);z-index:2}
#rm-root .insp-nav{display:flex;gap:6px;margin-bottom:10px}
#rm-root .insp-nav button{padding:3px 8px;font-size:11px}
#rm-root .type{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#rm-root .type i{width:10px;height:10px;border-radius:3px}
#rm-root .insp-head h2{margin:4px 0 4px;font-size:17px;word-break:break-word}
#rm-root .insp-head h2 .arrow{color:var(--accent);padding:0 6px}
#rm-root .path{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px;word-break:break-all}
#rm-root .path button{padding:1px 7px;font-size:10.5px;flex:none}
#rm-root .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
#rm-root .badge{font-size:10.5px;border:1px solid var(--border);border-radius:999px;padding:1px 8px;color:var(--ink);background:transparent}
#rm-root button.badge{cursor:pointer}
#rm-root .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px;border-bottom:1px solid var(--border)}
#rm-root .metric{background:var(--mask2);border:1px solid var(--border);border-radius:10px;padding:8px}
#rm-root .metric b{display:block;font-size:17px}
#rm-root .metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
#rm-root .metric.warn b{color:var(--warn)}
#rm-root .rankbar{grid-column:1/-1;font-size:11px;color:var(--muted)}
#rm-root .rankbar div{height:6px;border-radius:999px;background:var(--border);margin-top:5px;overflow:hidden}
#rm-root .rankbar div i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
#rm-root .doc{padding:12px 18px;border-bottom:1px solid var(--border);color:var(--ink);font-size:12.5px;line-height:1.7}
#rm-root .sentence{padding:12px 18px;border-bottom:1px solid var(--border);font-size:12.5px;line-height:1.7}
#rm-root .sentence b{color:var(--accent)}
#rm-root .actions{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border);align-items:center}
#rm-root .actions label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:64px}
#rm-root .insights{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
#rm-root .insight{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.6;background:var(--mask2)}
#rm-root .insight.warn{border-left-color:var(--caution)}
#rm-root .insight.bad{border-left-color:var(--warn)}
#rm-root .insight button{margin-top:5px;padding:1px 8px;font-size:10.5px}
#rm-root details{border-bottom:1px solid var(--border)}
#rm-root summary{cursor:pointer;padding:10px 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
#rm-root summary::-webkit-details-marker{display:none}
#rm-root summary::after{content:"+";color:var(--faint)}
#rm-root details[open] summary::after{content:"-"}
#rm-root .list{padding:0 12px 10px}
#rm-root .nb{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:7px}
#rm-root .nb:hover,#rm-root .nb:focus-visible{border-color:var(--border);background:var(--mask2)}
#rm-root .nb i{flex:none;width:8px;height:8px;border-radius:2px}
#rm-root .nb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rm-root .nb em{margin-left:auto;font-style:normal;color:var(--muted);font-size:10.5px;flex:none}
#rm-root .steps{padding:10px 12px 14px}
#rm-root .step-rel{margin:0 0 0 14px;padding:2px 0 2px 14px;border-left:2px dashed var(--border);font-size:10.5px;color:var(--muted)}
#rm-root .step-rel b{color:var(--accent);font-weight:600}
#rm-root .symfilter{width:calc(100% - 12px);margin:0 6px 8px;background:var(--canvas);border:1px solid var(--border);border-radius:8px;color:var(--ink);padding:5px 8px;font:inherit;font-size:11.5px}
#rm-root .sym{padding:6px 6px;border-radius:7px;border:1px solid transparent}
#rm-root .sym:hover{border-color:var(--border);background:var(--mask2)}
#rm-root .sym .k{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;border-radius:5px;padding:0 5px;margin-right:6px;background:var(--mask2);color:var(--accent);border:1px solid var(--border)}
#rm-root .sym .ln{float:right;color:var(--muted);font-size:10.5px}
#rm-root .sym code{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
#rm-root .sym p{margin:2px 0 0;font-size:11px;color:var(--ink);opacity:.85}
#rm-root .more{color:var(--muted);font-size:11px;padding:4px 6px}
#rm-root .chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px}
#rm-root .chip{font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 8px;background:transparent}
#rm-root button.chip{cursor:pointer}
#rm-root .help{padding:4px 18px 18px;color:var(--muted);font-size:11px;line-height:1.9}
#rm-root .help h4{margin:10px 0 2px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
@media (max-width:980px){
#rm-root .app{grid-template-columns:minmax(0,1fr)}
#rm-root #stage{min-height:62vh}
#rm-root #inspector{border-left:none;border-top:1px solid var(--border);max-height:none}
#rm-root #legend{width:min(290px,calc(100% - 24px))}
}
@media (prefers-reduced-motion:reduce){
#rm-root *{transition:none!important}
}
#rm-root{height:calc(100vh - 330px);min-height:560px}
</style>
<div id="rm-root">

<header class="topbar">
<div class="brand"><span>IntelGraph &middot; C2-centred fusion</span><b>IntelGraph</b></div>
<a class="home" href="/">&#8592; LazyOwn</a>
<div class="searchbox"><input id="search" type="search" autocomplete="off" placeholder="Find host, service, finding ( / )" aria-label="Find nodes" aria-controls="results"><div class="results" id="results" role="listbox"></div></div>
<div class="seg" role="group" aria-label="Layout">
<button type="button" data-layout="force" aria-pressed="true" title="Force-directed layout ( 1 )">Force</button>
<button type="button" data-layout="cluster" aria-pressed="false" title="Pull files toward their group centre ( 2 )">Clusters</button>
<button type="button" data-layout="radial" aria-pressed="false" title="Rings (2D) or shells (3D) by architectural layer ( 3 )">Layers</button>
<button type="button" data-layout="dag" aria-pressed="false" title="Top-down dependency levels ( 4 )">Tree</button>
</div>
<div class="seg" role="group" aria-label="View">
<button type="button" data-view="2d" aria-pressed="true" title="Flat map view ( V )">2D</button>
<button type="button" data-view="3d" aria-pressed="false" title="Spatial view; the 3D engine loads from CDN on first use ( V )">3D</button>
</div>
<div class="group">
<button type="button" id="btn-labels" aria-pressed="true" title="Toggle node names ( L )">Names</button>
<button type="button" id="btn-hulls" aria-pressed="true" title="Toggle group halos ( H )">Halos</button>
<button type="button" id="btn-flow" aria-pressed="true" title="Toggle flow particles on highlighted edges">Flow</button>
<button type="button" id="btn-freeze" aria-pressed="false" title="Freeze or resume physics ( Space )">Freeze</button>
<button type="button" id="btn-orbit" aria-pressed="false" title="Slowly orbit the camera ( O )" hidden>Orbit</button>
<button type="button" id="btn-fit" title="Fit graph to view ( F )">Fit</button>
<button type="button" id="btn-png" title="Export PNG snapshot of the current view">PNG</button>
<button type="button" id="btn-json" title="Export graph JSON">JSON</button>
<button type="button" id="btn-bundle" title="Open the circular/spherical bundle view">Bundles</button>
<button type="button" id="btn-theme" title="Toggle dark and light theme ( T )">Theme</button>
</div>
</header>
<div id="engine-error" role="alert"></div>
<div class="app">
<div id="stage">
<div id="graph" role="application" aria-label="Interactive dependency graph"></div>
<canvas id="overlay" aria-hidden="true"></canvas>
<div class="overlay" id="hud"></div>
<div class="overlay" id="pickbar" role="status" hidden><span id="pick-text"></span><button type="button" id="pick-cancel" title="Cancel path picking ( Esc )">Cancel</button></div>
<div class="overlay" id="legend">
<div class="lg-top"><h3>Legend</h3><button type="button" id="legend-toggle" aria-expanded="true" title="Collapse or expand the legend">Hide</button></div>
<div class="lg-body">
<h3><span>Color by</span></h3><div class="seg small" role="group" aria-label="Color by" id="colorby">
<button type="button" data-color="community" aria-pressed="true" title="Color files by import community ( C cycles )">Community</button>
<button type="button" data-color="layer" aria-pressed="false" title="Color files by architectural layer">Layer</button>
<button type="button" data-color="language" aria-pressed="false" title="Color files by language">Language</button>
</div>
<h3><span>Lenses</span><span>spot issues</span></h3><div class="pills" id="lenses"></div>
<h3><span>Nodes</span></h3><div class="pills" id="pills"></div>
<h3><span>Edges</span></h3><div class="pills" id="rels"></div>
<h3><span id="groups-title">Communities</span><span>click to focus</span></h3><div id="families"></div>
</div>
</div>
<div class="overlay" id="toast" role="status"></div>
<div id="ctx" role="menu" aria-label="Node actions"></div>
</div>
<aside id="inspector" aria-live="polite" aria-label="Inspector"></aside>
</div>
<div id="tip" role="tooltip"></div>
</div>
<script src="/static/js/force-graph-1.43.5.min.js"></script>
<script>

(function(){
"use strict";
const INTEL_DEFAULT_SETTINGS={"charge": -300, "linkDistance": 120, "linkStrength": 0.3, "nodeRelSize": 4, "hulls": true, "hullFill": 0.07, "hullStroke": 0.5, "hullPad": 18, "particles": 4, "dimNode": "rgba(80,85,110,.4)", "dimLink": "rgba(255,255,255,.04)", "mode": "2d", "labelTopN": 30, "labelZoom": 1.6, "labelMax": 28, "labelHighlightMax": 60, "clusterStrength": 0.6, "collidePad": 4, "collideMaxNodes": 1500, "dagLevel": 60, "flyMs": 700, "flyZoom": 3.0, "searchResults": 8, "symbolTotal": 40, "hitPad": 3.0, "minHitPx": 7.0, "edgeHitPx": 5.0, "dragPx": 4.0, "curveStep": 0.18, "curveSamples": 16, "arrowLen": 4.0, "arrowZoom": 2.2, "cooldownTicks": 400, "cooldownTicksReduced": 60, "docLinesPx": 9.0, "tipDocChars": 200, "hubTopN": 10, "fitPad": 48, "fitMaxZoom": 2.5, "fitLegendMinWidth": 700, "linkOpacity3d": 0.5, "linkWidth3dHighlight": 0.7, "linkWidth3dActive": 1.4, "particleWidth3d": 1.3, "depthFade": 0.3, "minGlyphPx": 2.5, "label3dPx": 9.0, "orbitSpeed": 0.6, "flyDistance3d": 320, "typeColors": {"file": "#4f8ef7", "community": "#7c5aef", "layer": "#4fef8e", "external": "#efb84f"}, "groupColors": {"layer": {}, "language": {}}};
function boot(g){
const RAW={nodes:(g.nodes||[]),edges:(g.edges||[])};
const ANALYTICS=g.analytics||{};
const SETTINGS=Object.assign({},INTEL_DEFAULT_SETTINGS,g.settings||{});
const CDN_2D="/static/js/force-graph-1.43.5.min.js";
const CDN_3D="/static/js/3d-force-graph-1.73.4.min.js";
const reduced=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const fly=reduced?0:SETTINGS.flyMs;
const $=id=>document.getElementById(id);
const short=(t,n)=>{t=String(t==null?"":t);return t.length>n?t.slice(0,n-1)+"…":t;};

document.addEventListener("keydown",e=>{
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA"||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==="/"){e.preventDefault();$("search").focus();}
  else if(k==="Escape"){if($("ctx").style.display==="block")hideMenu();else if(S.pick)cancelPick();else clearSelection();}
  else if(k==="Backspace"){e.preventDefault();goBack();}
  else if(k==="l")$("btn-labels").click();
  else if(k==="h")$("btn-hulls").click();
  else if(k==="f")$("btn-fit").click();
  else if(k==="t")toggleTheme();
  else if(k==="v")setView(is3d?"2d":"3d");
  else if(k==="o"&&is3d)$("btn-orbit").click();
  else if(k===" "){e.preventDefault();$("btn-freeze").click();}
  else if(k==="i")toggleIsolate();
  else if(k==="u")setDir("up");
  else if(k==="d")setDir("down");
  else if(k==="b")setDir("both");
  else if(k==="p"){if(S.selected)startPick(S.selected);else toast("Select a node first, then press P");}
  else if(k==="x"){if(S.selected)hideNode(S.selected);}
  else if(k==="c"){const modes=Object.keys(GROUP_LABELS);setColorBy(modes[(modes.indexOf(S.colorBy)+1)%modes.length]);}
  else if(["1","2","3","4"].includes(k)){const b=document.querySelectorAll("[data-layout]")[+k-1];if(b)b.click();}
});
function hashParams(){try{return new URLSearchParams((location.hash||"").slice(1));}catch(e){return new URLSearchParams();}}
function applyHashSettings(){
  const p=hashParams();
  const lay=p.get("layout");if(["force","cluster","radial","dag"].includes(lay))S.layout=lay;
  const col=p.get("color");if(GROUP_LABELS[col]){S.colorBy=col;document.querySelectorAll("[data-color]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.color===col)));buildGroups();}
  const dir=p.get("dir");if(["both","up","down"].includes(dir))S.dir=dir;
  const dep=p.get("depth");if(dep!==null&&["0","1","2","3"].includes(dep))S.depth=+dep;
  const view=p.get("view")||SETTINGS.mode;return view==="3d";
}
function applyHashSelection(){
  const p=hashParams();
  const path=p.get("path");if(path){const ab=path.split("~");if(ab.length===2&&byId[ab[0]]&&byId[ab[1]]){runPath(ab[0],ab[1]);return;}}
  const lens=p.get("lens");if(lens&&LENSES[lens]){showLens(lens);return;}
  const grp=p.get("group");if(grp&&groups().members[grp]){focusGroup(grp);return;}
  const edge=p.get("edge");if(edge&&edgeByKey[edge]){selectEdge(edge);return;}
  const id=p.get("node");if(id&&byId[id])select(id,{fly:true});
}
function writeHash(){
  const p=new URLSearchParams();
  if(S.selected)p.set("node",S.selected);
  if(S.selEdge)p.set("edge",S.selEdge);
  if(S.path)p.set("path",S.path.a+"~"+S.path.b);
  if(S.lens)p.set("lens",S.lens);
  if(S.group)p.set("group",S.group);
  if(is3d)p.set("view","3d");
  if(S.layout!=="force")p.set("layout",S.layout);
  if(S.colorBy!=="community")p.set("color",S.colorBy);
  if(S.dir!=="both")p.set("dir",S.dir);
  if(S.depth!==1)p.set("depth",String(S.depth));
  try{history.replaceState(null,"","#"+p.toString());}catch(e){}
}
function screenOf(id){
  const n=byId[id];if(!n||n.x==null)return null;
  if(is3d){const q=PROJ_BY[id];return q?{x:q.x,y:q.y,r:q.r}:null;}
  if(!g2)return null;const s=g2.graph2ScreenCoords(n.x,n.y);return {x:s.x,y:s.y,r:radius(n)*(S.zoom||1)};
}
window.ReadmenatorExplorer=Object.freeze({state:S,graph:()=>cur(),is3d:()=>is3d,select:id=>select(id,{fly:true}),selectEdge,path:runPath,lens:showLens,view:setView,colorBy:setColorBy,screenOf,hitAt:(x,y)=>{const h=hitAt({x,y});return h?(h.node?{node:h.node.id}:{edge:h.link.key}):null;}});
if(typeof ResizeObserver!=="undefined")new ResizeObserver(()=>resize()).observe($("stage"));
window.addEventListener("resize",resize);
renderEmpty();
if(applyHashSettings())ensure3D(()=>{is3d=true;mount();},()=>ensure2D(mount));else ensure2D(mount);
}
document.getElementById("hud").textContent="Loading campaign graph\u2026";
fetch("/api/intel_graph?layout=force",{credentials:"same-origin"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).then(function(g){try{boot(g);}catch(e){var m=document.getElementById("engine-error");m.style.display="block";m.textContent="Graph failed: "+((e&&e.message)||e);}}).catch(function(e){var m=document.getElementById("engine-error");m.style.display="block";m.textContent="Could not load /api/intel_graph?layout=force: "+((e&&e.message)||e);});
})();

</script>

(function(){var m=document.querySelector("main.container");if(m){m.classList.remove("container");m.classList.add("container-fluid");}})();
</script>
