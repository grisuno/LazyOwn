name: mysql_jdv_definer_sqli
description: |
  MySQL 26.7.0 JSON Duality DEFINER SQLi lab (Abraxas Labs, CVSS 8.1 High, CWE-89).
  Loopback docker lab (mysql:26.7.0, 127.0.0.1:18640) proving a DEFINER subquery
  via NO_BACKSLASH_ESCAPES on JDV DML, leaking secret.s into the projected name.
  First time: needs docker plus python3 with pymysql and cryptography.
  Flow: assign rhost 127.0.0.1, assign rport 18640, then run mysql_jdv_definer_sqli.
  Lab-only, authorized testing. Witness string only, default sql_mode is the control.
author: abraxas
version: "1.0"
enabled: true
params:
  - name: rhost
    type: string
    required: false
    default: 127.0.0.1
    description: Lab MySQL host. The lab is loopback-pinned by upstream run.sh.
  - name: rport
    type: integer
    required: false
    default: 18640
    description: Lab MySQL port for the jdv-definer-sqli compose stack.
os: any
trigger: []
category: "03. Exploitation"
module_type: exploit
tool:
  name: mysql-jdv-definer-sqli
  repo_url: https://github.com/abraxas/mysql-jdv-definer-sqli.git
  install_path: external/.exploit/mysql-jdv-definer-sqli
  install_command: python3 -m pip install --break-system-packages pymysql cryptography
  execute_command: python3 mysql-jdv-definer-sqli-Abraxas-Labs.py
