services:
  lazyown:
    image: ghcr.io/grisuno/lazyown:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: lazyown-c2
    stdin_open: true
    tty: true
    environment:
      - HEADLESS=${HEADLESS:-false}
      - C2_PORT=${C2_PORT:-4444}
      - RHOST=${RHOST:-}
      - LHOST=${LHOST:-0.0.0.0}
    volumes:
      - ../../payload.json:/app/payload.json:ro
      - ../../sessions:/app/sessions
      - ../../profiles:/app/profiles:ro
    expose:
      - "4444"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: lazyown-c2-tls
    depends_on:
      - lazyown
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
