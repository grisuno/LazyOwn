    source: addon
  addon:applocker_bypass_csc:
    enabled: false
    phase: exploit
    risk: exploit
    description: 'Bypass AppLocker/WDAC using csc.exe (C# compiler, signed Microsoft
      binary). Compile C# payload from a file or URL and execute. csc.exe is allowed
      by default in WDAC policies that allow MSBuild. MITRE: T1027.004 Compile After
      Delivery, T1218 Signed Binary Proxy Execution.'
    source: addon
  addon:applocker_bypass_installutil:
    enabled: false
    phase: exploit
    risk: exploit
    description: 'Bypass AppLocker/Device Guard by abusing InstallUtil.exe (signed
      Microsoft binary) to execute unsigned .NET assemblies. InstallUtil is in the
      default AppLocker allowlist. Compile a .NET assembly with the required Installer
      class and execute. MITRE: T1218.004 InstallUtil.'
    source: addon
  addon:applocker_bypass_msbuild:
    enabled: false
    phase: exploit
    risk: exploit
    description: 'Bypass AppLocker/WDAC by abusing MSBuild.exe (signed Microsoft binary)
      to compile and execute inline C# code. MSBuild is in the default WDAC allowlist
      on most Windows 10/11 and Server builds. MITRE: T1127.001 MSBuild.'
    source: addon
  addon:applocker_bypass_mshta:
    enabled: false
    phase: exploit
    risk: exploit
    description: 'Bypass AppLocker/WDAC using mshta.exe (Microsoft HTML Application
      Host). Executes HTA/JavaScript payloads from local files or remote URLs. mshta.exe
      is signed by Microsoft and commonly allowlisted. MITRE: T1218.005 Mshta.'
    source: addon
  addon:applocker_bypass_presentationhost:
    enabled: false
    phase: exploit
    risk: exploit
    description: 'Bypass AppLocker/WDAC using PresentationHost.exe (.NET Framework
      WPF host). Executes XAML Browser Application (.xbap) files. PresentationHost.exe
      is signed by Microsoft and often overlooked in WDAC policies. MITRE: T1218 Signed
      Binary Proxy Execution.'
    source: addon
  addon:applocker_bypass_regsvcs_regasm:
    enabled: false
    phase: exploit
    risk: exploit
    description: 'Bypass AppLocker via Regsvcs.exe/Regasm.exe (signed Microsoft binaries).
      These binaries load .NET assemblies and are in the default WDAC allowlist. Compile
      a .NET assembly and execute via Regsvcs.exe with /tlb: argument. MITRE: T1218.009
      Regsvcs/Regasm.'
    source: addon
  addon:applocker_bypass_rundll32:
    enabled: false
    phase: exploit
    risk: exploit
    description: 'Bypass AppLocker/WDAC using rundll32.exe (signed Microsoft binary).
      Executes JavaScript/VBScript from a .sct file (scriptlet) either from local
      disk or a remote URL. Supports DLL proxying for additional stealth. MITRE: T1218.011
      Rundll32.'
    source: addon
  addon:argfuscator:
    enabled: false
