{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card bg-secondary text-light p-4 mb-4">
        <h2 class="text-center mb-4">Change password</h2>
        <p class="text-center">You are using a one-time password. Set a strong password to continue.</p>
        <form method="POST">
            <div class="mb-3">
                <label for="current_password" class="form-label">Current password:</label>
                <input type="password" id="current_password" name="current_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label">New password (min 12 chars):</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm new password:</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Update password</button>
        </form>
    </div>
</div>
{% endblock %}
