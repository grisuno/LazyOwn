    source: addon
  addon:NullGate:
    enabled: false
    phase: exploit
    risk: safe
    description: Library that eases the use of indirect syscalls. Quite interesting
      AV/EDR bypass as PoC.
    source: addon
  addon:OVSwrap:
    enabled: false
    phase: exploit
    risk: safe
    description: "OVSwrap (CVE-2026-64531) is a non-universal (but broad) Linux LPE\
      \ found by giving LLMs the tools to reason through memory safety issues\u2019\
      \ geometry (coupled with CIFSwitch-discovery-style graph reasoning tools). Read\
      \ on for affected distros, mitigations, and vulnerability details."
    source: addon
  addon:OverRide:
    enabled: false
    phase: exploit
    risk: safe
    description: This project provides a proof-of-concept implementation of the "Process
      Overwriting" (a form of Process Hollowing) technique in plain C. The injector
      launches a legitimate target process in a suspended state and then overwrites
      its main executable module in memory with a custom payload. The main thread's
      context is then updated to point to the payload's entry point, and the process
      is resumed.
    source: addon
  addon:PTMultiTools:
    enabled: false
