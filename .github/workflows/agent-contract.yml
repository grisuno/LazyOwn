name: agent-contract

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main, pp]

permissions:
  contents: read

jobs:
  validate:
    name: validate-agent-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run AGENTS.md contract validation
        run: bash scripts/validate_agent_contract.sh
