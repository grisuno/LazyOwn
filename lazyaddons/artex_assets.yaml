name: artex_assets
description: Read ARTEX v0.3.12 asset graph coverage in English. Needs artex up and
  assign url http://127.0.0.1:8787. Shows asset counts. Sync ScopeSentry via POST
  /api/sync/scopesentry/sync. Save with free arg -o sessions/artex_assets.json.
author: Hinln (fork of Autumn-27)
version: 0.3.12
enabled: true
params:
  - name: url
    type: string
    required: true
    description: ARTEX base URL, e.g. http://127.0.0.1:8787. Set with assign url.
os: any
trigger: []
category: 16. Artificial Intelligence
tool:
  name: ARTEX Assets
  repo_url: https://github.com/Hinln/ARTEX.git
  install_path: external/.exploit/artex
  install_command: git fetch --all --tags && git checkout 0ec51e3 && go build -tags
    embedui -o artex ./cmd/artex
  execute_command: curl -sSf {url}/api/assets/counts
