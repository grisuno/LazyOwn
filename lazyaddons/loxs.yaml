name: loxs
description: "loxs multi-vulnerability scanner (LFI, RCE, XSS, SQLi) driven from\nits interactive console.\n\
  \nOperator flow: run `loxs` and follow the tool menu.\n\nExamples:\n  loxs\n\nRequirements: cloned on\
  \ first run from\nhttps://github.com/coffinxp/loxs.git into external/.exploit/loxs\n(pip3 install -r\
  \ requirements.txt runs once on the fresh clone).\n"
author: LazyOwn RedTeam
version: '1.0'
enabled: true
update: false
os: linux
trigger:
- http
params: []
tool:
  name: loxs
  repo_url: https://github.com/coffinxp/loxs.git
  install_path: external/.exploit/loxs
  install_command: pip3 install -r requirements.txt
  execute_command: python3 loxs.py
category: 02. Scanning & Enumeration
module_type: scanner
