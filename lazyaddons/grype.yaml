name: grype
description: >
  Vulnerability scanner for container images, filesystems, and SBOMs.

  Grype matches discovered packages against a curated vulnerability database
  and outputs detailed CVE information including severity, fix versions,
  and CVSS scores. Supports scanning of:
    - Container images (Docker, OCI)
    - Directory filesystems
    - Syft-generated SBOMs (SPDX, CycloneDX)

  Usage:
    grype nginx:latest
    grype /path/to/project
    grype sbom:./sbom.spdx.json

  Output is written to sessions/grype_output.json.

  No cloud credentials required — vulnerability DB is cached locally.

author: Anchore
version: 0.78.0
enabled: true
os: any
trigger: []
params:
  - name: grype_target
    type: string
    required: false
    default: "."
    description: Target to scan (image name, directory path, or sbom file).
tool:
  name: Grype
  repo_url: https://github.com/anchore/grype.git
  install_path: external/.exploit/grype
  install_command: >
    rm -rf grype 2>/dev/null;
    curl -sSfL https://github.com/anchore/grype/releases/download/v0.115.0/grype_0.115.0_linux_amd64.tar.gz
    | tar xz -C . grype && chmod +x grype
  execute_command: >
    ./grype
    --output json
    --file ../../../sessions/grype_{grype_target}.json
    --only-fixed
    {grype_target}
category: 02. Scanning & Enumeration
