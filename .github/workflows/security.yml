name: security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  bandit:
    name: bandit (baseline ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install bandit
        run: pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Enforce bandit against triaged baseline
        run: |
          bandit -c pyproject.toml -r cli core modules skills utils.py lazyown.py lazyc2.py \
            -ll -b scripts/baselines/bandit_baseline.json

  bandit-widened:
    name: bandit (full tree, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install bandit
        run: pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run bandit over the full tree
        run: bandit -c pyproject.toml -r . -ll -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-full-report
          path: bandit-report.json
          if-no-files-found: ignore

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install detect-secrets
        run: pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Scan for secrets
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets scan --baseline .secrets.baseline
          else
            detect-secrets scan --exclude-files 'graphify-out/.*|sessions/.*|external/.*|modules_ext/.*|payload\.json'
          fi
        continue-on-error: true

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pip-audit
        run: pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Audit dependencies
        run: pip-audit --strict --skip-editable || true
        continue-on-error: true
