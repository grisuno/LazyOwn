# Operator-declared parameters.
#
# One place to declare a parameter that every surface can use: lazyaddons
# ({param} substitution), aliases, pipelines and the shell `assign` command.
# Manage it from the lazy_orchestrator TUI (Params tab) or with
# `param create <name> --kind string --default "" --desc "..."`.
#
# Format per entry:
#   name:
#     kind: string          # string|integer|boolean|url|path|ip|port|...
#     default: value
#     description: "help text"
#     category: general
#
# Use generic names: a key only one addon understands belongs in that
# addon, not in the shared catalog.
exploit_profile:
  category: network
  default: bookworm
  description: Calibration profile of the target build. php2shell expects 'bookworm'
    (official php:8.4.26-apache image) or 'lab' (Apache 2.4.68 build).
  kind: string
graph_store:
  category: general
  default: sessions/lazygraph
  description: Engagement fact-graph store path shared by the lazygraph addon and
    handoff surfaces. Relative paths resolve from the repo root.
  kind: path
poc_binary:
  category: general
  default: /home/grisun0/src_note/c/signdrop/sigdrop.exe
  description: Path to the cross-compiled SignDrop PoC binary staged into
    the WinBox lab VM by PoC-packaging lazyaddons.
  kind: path
poc_exec_opts:
  category: general
  default: ''
  description: Extra winbox exec options for PoC execution (e.g.
    "--user winbox --password 'WinboxP@ss123'"). Empty means SYSTEM exec,
    which is the only mode where the guest agent streams stdout.
  kind: string
poc_timeout:
  category: general
  default: 120
  description: winbox exec timeout (seconds) for PoC execution.
  kind: integer
